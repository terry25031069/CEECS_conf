<!DOCTYPE html
    PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml">
<head>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
    <title>{% block title %}第廿六屆海峽兩岸資訊技術研討會{% endblock %}</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link type="text/css" rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div id="WRAPPER">
        <div id="HEADER">
            <div align="center">
                <img src="{{ url_for('static', filename='logo_2024.jpg') }}">
            </div>
        </div>
        <div id="MAIN_NAV">
            <ul>
                <li><a href="{{ url_for('index') }}">徵稿通知</a></li>
                <!-- <li><a href="{{ url_for('agenda') }}">會議議程</a></li> -->
                <li><a href="/static/guide.pdf">大會手冊</a></li>
                <!-- <li><a href="{{ url_for('organization') }}">組織名單</a></li> -->
            </ul>
        </div>
        <div id="SUB_NAV_1">
            <ul>
                <h3>最新消息</h3>
                <li><h4>Sep. 10, 2024</h4><p>網頁上線</p></li>
            </ul>
            <ul>
                <h3>重要日期</h3>
                <li>截稿日期：2024 年 10 月 11 日 (延長至 11 月 30 日)</li>
                <li>會議時間：2025 年 1 月 6 日 - 10 日</li>
            </ul>
            <ul>
                <h3>指導單位</h3>
                <p align="center">
                    <a href="https://www.edu.tw/Default.aspx" target="_blank">
                        <img src="{{url_for('static', filename='org_logo/Ministry_Edu.png')}}" width="260" height="125">
                    </a>
                </p>

                <h3>主辦單位</h3>
                <p align="center">
                    <a href="http://www.ncu.edu.tw/" target="_blank">
                        <img src="{{url_for('static', filename='org_logo/ncu.jpg')}}" width="180" height="160">
                    </a>
                </p>
                
                <h3>協辦單位</h3>
                <p align="center">
                    <a href="http://www.seu.edu.cn/" target="_blank">
                        <img src="{{url_for('static', filename='org_logo/Misistry_Sci_Tech.png')}}" width="240" height="71">
                    </a>
                </p>
                <p align="center">
                    <a href="http://www.seu.edu.cn/" target="_blank">
                        <img src="{{url_for('static', filename='org_logo/seu.png')}}" width="240" height="200">
                    </a>
                </p>
                <p align="center">
                    <a href="http://www.example.com/" target="_blank">
                        <img src="{{url_for('static', filename='org_logo/tegta.png')}}" width="240" height="150">
                    </a>
                </p>
            </ul>

        </div>
        <div id="CONTENT">
            {% block content %}{% endblock %}
        </div>
        <div id="FOOTER">
            <p align="center">國立中央大學資訊工程學系</p>
        </div>
    </div>
</body>
</html>
